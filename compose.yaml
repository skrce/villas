services:
  db:
    image: ${VILLAS_MARIADB_IMAGE:?Run node scripts/dev-db.mjs start}
    environment:
      MARIADB_DATABASE: villarosa
      MARIADB_USER: villas_local
      MARIADB_PASSWORD: ${VILLAS_DB_PASSWORD:?Use the local database launcher}
      MARIADB_ROOT_PASSWORD: ${VILLAS_DB_ROOT_PASSWORD:?Use the local database launcher}
      TZ: UTC
    ports:
      - "127.0.0.1::3306"
    volumes:
      - database:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  database:
