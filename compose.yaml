services:
  db:
    image: ${VILLAS_POSTGRES_IMAGE:?Run node scripts/dev-db.mjs start}
    environment:
      POSTGRES_DB: villarosa
      POSTGRES_USER: villas_local
      POSTGRES_PASSWORD: ${VILLAS_DB_PASSWORD:?Use the local database launcher}
      TZ: UTC
    ports:
      - "127.0.0.1::5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--username=villas_local", "--dbname=villarosa"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  database:
