spring:
  datasource:
    url: jdbc:h2:mem:villarosa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  session:
    jdbc:
      initialize-schema: always
      schema: classpath:test-session-schema.sql

villas:
  mode: test
  public-url: http://localhost:5173
  google:
    client-id: villas-test
    client-secret: synthetic-secret
  auth:
    provider: synthetic
    synthetic-issuer: http://127.0.0.1:19099

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
