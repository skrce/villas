spring:
  application:
    name: villarosa
  datasource:
    url: ${VILLAS_DB_URL:}
    username: ${VILLAS_DB_USERNAME:}
    password: ${VILLAS_DB_PASSWORD:}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  session:
    timeout: 3d
    jdbc:
      initialize-schema: never
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true

server:
  address: ${VILLAS_BIND_ADDRESS:127.0.0.1}
  port: ${VILLAS_PORT:9098}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  paths-to-match: /api/v1/**
  api-docs:
    enabled: false
    version: OPENAPI_3_0
  swagger-ui:
    enabled: false
  writer-with-order-by-keys: true

villas:
  mode: ${VILLAS_MODE:production}
  currency: EUR
  property-timezone: Europe/Skopje
  public-url: ${VILLAS_PUBLIC_URL:}
  google:
    client-id: ${VILLAS_GOOGLE_CLIENT_ID:}
    client-secret: ${VILLAS_GOOGLE_CLIENT_SECRET:}
  auth:
    provider: ${VILLAS_AUTH_PROVIDER:google}
